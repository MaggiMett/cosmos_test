[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-runtime"
version = "1.0.0"
description = "Cosmos Version 1 runtime foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "setuptools>=75",
  "wheel>=0.45,<1",
]

[project.scripts]
cosmos = "cosmos.__main__:main"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
cosmos = ["persistence/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
